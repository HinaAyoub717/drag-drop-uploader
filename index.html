<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drag and Drop File Uploader</title>
  <style>
    :root {
      --ink: #1b2b4b;
      --muted: #6b7a99;
      --brand: #5b6cff;
      --brand-2: #8a5cf6;
      --soft: #f3f4ff;
      --error: #d93a4a;
      --ok: #1fa971;
    }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, #e8ebff 0%, #f6eaff 50%, #e3f6ff 100%);
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 0 20px 50px rgba(60, 70, 140, 0.18);
    }

    h1 { margin: 0; font-size: 1.5rem; text-align: center; }
    .subtitle { margin: .4rem 0 1.5rem; text-align: center; color: var(--muted); font-size: .95rem; }

    /* ---------- Drop area ---------- */
    #drop-area {
      border: 2.5px dashed #b9c1ff;
      border-radius: 18px;
      padding: 2.2rem 1rem;
      text-align: center;
      background: var(--soft);
      cursor: pointer;
      transition: background .25s, border-color .25s, transform .25s, box-shadow .25s;
    }
    #drop-area:hover { border-color: var(--brand); background: #eceeff; }

    /* Added by JavaScript while a file is dragged over the box */
    #drop-area.dragover {
      border-color: var(--brand);
      background: #e4e7ff;
      transform: scale(1.03);
      box-shadow: 0 10px 30px rgba(91, 108, 255, .25);
    }
    #drop-area.dragover .icon { animation: bounce .6s ease infinite alternate; }

    .icon {
      width: 64px; height: 64px;
      margin: 0 auto .8rem;
      border-radius: 50%;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      box-shadow: 0 8px 20px rgba(91, 108, 255, .35);
    }
    .icon svg { width: 30px; height: 30px; }
    .drop-title { margin: 0; font-weight: 600; font-size: 1.05rem; }
    .drop-title span { color: var(--brand); text-decoration: underline; }
    .drop-hint { margin: .35rem 0 0; color: var(--muted); font-size: .85rem; }

    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-8px); } }

    /* ---------- Error ---------- */
    #error {
      margin: 1rem 0 0;
      padding: 0;
      color: var(--error);
      font-weight: 600;
      text-align: center;
      min-height: 1.2em;
    }
    #error.show { animation: shake .4s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    /* ---------- Progress bar ---------- */
    #progress-wrap { margin-top: 1.2rem; }
    #progress-wrap[hidden] { display: none; }
    .progress-info { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-bottom: .4rem; }
    .track { height: 12px; background: #e6e9fb; border-radius: 999px; overflow: hidden; }
    #progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--brand), var(--brand-2));
      transition: width .15s linear;
    }
    #progress-bar.done { background: var(--ok); }

    /* ---------- Preview ---------- */
    #preview { margin-top: 1.2rem; }
    .preview-card {
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #e6e9fb;
      animation: pop .4s ease;
    }
    .preview-card img { display: block; width: 100%; max-height: 300px; object-fit: cover; }
    .preview-meta { display: flex; justify-content: space-between; gap: .5rem; padding: .7rem 1rem; font-size: .88rem; background: var(--soft); }
    .preview-meta strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .preview-meta span { color: var(--ok); font-weight: 600; white-space: nowrap; }
    @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }

    /* ---------- Saved images (localStorage) ---------- */
    #saved { margin-top: 1.8rem; }
    #saved[hidden] { display: none; }
    .saved-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: .7rem; }
    .saved-head h2 { margin: 0; font-size: 1.05rem; }
    #clear-btn {
      border: 0; background: #fdecee; color: var(--error);
      padding: .4rem .8rem; border-radius: 999px;
      font-weight: 600; font-size: .8rem; cursor: pointer;
    }
    #clear-btn:hover { background: #fbd9dd; }
    #gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; }
    #gallery img {
      width: 100%; aspect-ratio: 1; object-fit: cover;
      border-radius: 12px; border: 1px solid #e6e9fb;
      animation: pop .4s ease;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Upload your image</h1>
    <p class="subtitle">JPG, PNG or GIF files only</p>

    <div id="drop-area">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 16V4"></path>
          <path d="M7 9l5-5 5 5"></path>
          <path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path>
        </svg>
      </div>
      <p class="drop-title">Drag and drop your image here, or <span>browse</span></p>
      <p class="drop-hint">Maximum one image at a time</p>
      <input type="file" id="file-input" accept="image/png, image/jpeg, image/gif" hidden>
    </div>

    <p id="error" role="alert"></p>

    <div id="progress-wrap" hidden>
      <div class="progress-info">
        <span id="progress-label">Uploading...</span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="track"><div id="progress-bar"></div></div>
    </div>

    <div id="preview"></div>

    <section id="saved" hidden>
      <div class="saved-head">
        <h2 id="saved-title">Saved images</h2>
        <button type="button" id="clear-btn">Clear all</button>
      </div>
      <div id="gallery"></div>
    </section>
  </main>

  <script>
    // 1. Grab the elements
    const dropArea = document.getElementById("drop-area");
    const fileInput = document.getElementById("file-input");
    const errorEl = document.getElementById("error");
    const previewEl = document.getElementById("preview");
    const progressWrap = document.getElementById("progress-wrap");
    const progressBar = document.getElementById("progress-bar");
    const progressLabel = document.getElementById("progress-label");
    const progressPercent = document.getElementById("progress-percent");

    // Only these file types are allowed
    const ALLOWED_TYPES = ["image/jpeg", "image/png", "image/gif"];
    let uploading = false;   // stops a second file from starting mid-upload

    // 2. Click the box -> open the normal file chooser
    dropArea.addEventListener("click", () => fileInput.click());

    // 3. A file was picked with the chooser
    fileInput.addEventListener("change", () => {
      if (fileInput.files.length > 0) handleFile(fileInput.files[0]);
      fileInput.value = "";   // lets the same file be chosen again
    });

    // 4. Drag events
    dropArea.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropArea.classList.add("dragover");
    });
    dropArea.addEventListener("dragleave", () => {
      dropArea.classList.remove("dragover");
    });
    dropArea.addEventListener("drop", (e) => {
      e.preventDefault();
      dropArea.classList.remove("dragover");
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    // 5. Check the file, then start the fake upload
    function handleFile(file) {
      if (uploading) return;
      showError("");
      previewEl.innerHTML = "";
      progressWrap.hidden = true;

      if (!ALLOWED_TYPES.includes(file.type)) {
        showError("Invalid file. Please upload a JPG, PNG or GIF image.");
        return;
      }
      simulateUpload(file);
    }

    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.remove("show");
      if (message) {
        void errorEl.offsetWidth;   // restarts the shake animation
        errorEl.classList.add("show");
      }
    }

    // 6. Fake upload: the bar grows a little at a time using setTimeout
    function simulateUpload(file) {
      uploading = true;
      let progress = 0;
      progressBar.classList.remove("done");
      progressLabel.textContent = "Uploading " + file.name;
      progressWrap.hidden = false;
      setProgress(0);

      function tick() {
        progress += Math.random() * 12 + 4;   // add 4 to 16 percent each time
        if (progress >= 100) {
          setProgress(100);
          progressBar.classList.add("done");
          progressLabel.textContent = "Upload complete";
          setTimeout(() => { showPreview(file); uploading = false; }, 400);
          return;
        }
        setProgress(progress);
        setTimeout(tick, 150);
      }
      setTimeout(tick, 150);
    }

    function setProgress(value) {
      const rounded = Math.round(value);
      progressBar.style.width = rounded + "%";
      progressPercent.textContent = rounded + "%";
    }

    // 7. Read the file and show it as an image (FileReader API)
    function showPreview(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        previewEl.innerHTML = `
          <div class="preview-card">
            <img src="${e.target.result}" alt="">
            <div class="preview-meta">
              <strong></strong>
              <span>${formatSize(file.size)}</span>
            </div>
          </div>`;
        previewEl.querySelector("strong").textContent = file.name;
        previewEl.querySelector("img").alt = file.name;
        saveImage({ name: file.name, size: file.size, src: e.target.result });
      };
      reader.readAsDataURL(file);
    }

    // 8. localStorage: keep uploaded images after a page refresh
    const STORAGE_KEY = "uploadedImages";
    const savedSection = document.getElementById("saved");
    const savedTitle = document.getElementById("saved-title");
    const gallery = document.getElementById("gallery");

    // Read the saved list (localStorage only stores text, so we use JSON)
    function loadImages() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (err) {
        return [];
      }
    }

    function saveImage(image) {
      const images = loadImages();
      images.push(image);
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(images));
      } catch (err) {
        // localStorage is small (about 5 MB), so big images can fill it up
        showError("Storage is full. This image could not be saved. Click Clear all to free space.");
        return;
      }
      renderGallery();
    }

    function renderGallery() {
      const images = loadImages();
      gallery.innerHTML = "";
      savedSection.hidden = images.length === 0;
      savedTitle.textContent = "Saved images (" + images.length + ")";
      images.forEach((image) => {
        const img = document.createElement("img");
        img.src = image.src;
        img.alt = image.name;
        img.title = image.name;
        gallery.appendChild(img);
      });
    }

    document.getElementById("clear-btn").addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      renderGallery();
    });

    // Show the saved images as soon as the page opens
    renderGallery();

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }
  </script>
</body>
</html>
